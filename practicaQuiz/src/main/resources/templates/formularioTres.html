<form th:action="@{/conocimientos}" th:object="${alumno}" method="post">
	
	<label for="anio">Selecciona el año</label><br>
	<input type="radio" th:field="*{anio}" value="1º">1º Año
	<input type="radio" th:field="*{anio}" value="2º">2º Año<br>
		<p style="color:red;" th:if="${#fields.hasErrors('anio') && !primeraVez}" th:errors="*{anio}"></p>
	
	<button type="submit">Guardar</button>

	
</form>

<form th:action="@{/atrasAFormularioDos}" th:object="${alumno}" method="post"> 
				
		<button type="submit">Atrás</button>
	
</form>
