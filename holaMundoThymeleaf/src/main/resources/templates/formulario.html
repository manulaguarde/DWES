<h2>Registro de Nueva Persona</h2>

<!-- th:action indica a qué ruta del controlador enviará los datos -->
<!-- method="post" indica que se usará el método HTTP POST -->
<form th:action="@{/guardarPersona}" method="post">
    
    <label for="nombre">Nombre:</label><br/>
    <!-- El atributo name es fundamental: debe coincidir con el @RequestParam del controlador -->
    <input type="text" id="nombre" name="nombre" required /><br/><br/>

    <label for="edad">Edad:</label><br/>
    <input type="number" id="edad" name="edad" required /><br/><br/>

    <button type="submit">Enviar Datos</button>
</form>
