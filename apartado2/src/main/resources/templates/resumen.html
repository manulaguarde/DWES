<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resumen</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
    <div class="contenedor">
        <h2>Resumen Enviado</h2>
        <p><strong>Nombre:</strong> <span th:text="${alumnoForm.nombre}"></span></p>
        <p><strong>Curso:</strong> <span th:text="${alumnoForm.curso}"></span></p>
        <p><strong>Hobbies:</strong></p>
        <ul>
            <li th:each="hobby : ${alumnoForm.hobbies}" th:text="${hobby}"></li>
        </ul>
        <a href="/">Volver</a>
    </div>
</body>
</html>
